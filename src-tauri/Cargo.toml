[package]
name = "winzamp"
version = "0.4.5"
description = "A modern Winamp that visualizes whatever your Mac is playing."
authors = ["Jason Sutter"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winzamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rustfft = "6"
anyhow = "1"
# Song identification (ACRCloud): HTTP + HMAC-SHA1 request signing.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
# Song identification (Shazam): signature checksum + request ids.
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }

# Real system-audio EQ (macOS): a muted Core Audio process tap + an aggregate
# device whose output is the real speakers, driven by one IOProc that runs the
# biquad bands. Same objc2 CoreAudio crates cpal already compiles, so no new
# heavy build. All used only behind cfg(target_os = "macos").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "objc2-core-audio-types", "AudioHardware", "AudioHardwareDeprecated"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "objc2", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFBase", "CFArray", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSDictionary"] }

# Skin transport buttons send system media keys (play/pause, next, ...).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# Skin volume slider: Core Audio master volume (COM).
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
