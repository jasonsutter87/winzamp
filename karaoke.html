<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WinzAMP — Karaoke</title>
    <style>
      :root {
        --bg: #0a0a16;
        --dim: #4a4a70;
        --upcoming: #9aa0d0;
        --active: #fff;
        --glow: #35e0ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #15153a, var(--bg));
        color: var(--active);
        font-family: "Helvetica Neue", Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 auto;
        padding: 16px 28px 8px;
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      #track { font-size: 20px; font-weight: 700; }
      #artist { font-size: 15px; color: var(--upcoming); }
      #identify {
        margin-left: auto;
        font: 600 12px "Helvetica Neue", Arial, sans-serif;
        color: #cfe8ff;
        background: rgba(53, 224, 255, 0.12);
        border: 1px solid rgba(53, 224, 255, 0.4);
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }
      #identify:active, #carmode:active {
        background: rgba(53, 224, 255, 0.28);
      }
      #carmode {
        font: 600 12px "Helvetica Neue", Arial, sans-serif;
        color: #cfe8ff;
        background: rgba(53, 224, 255, 0.12);
        border: 1px solid rgba(53, 224, 255, 0.4);
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }
      /* Car mode: dash-mounted, read-from-the-driver's-seat sizing. */
      body.car header { padding: 10px 28px; }
      body.car #track { font-size: 26px; }
      body.car #artist { font-size: 18px; }
      body.car #identify, body.car #carmode { padding: 10px 18px; font-size: 15px; }
      body.car #src { display: none; }
      body.car .line { font-size: 52px; line-height: 1.45; }
      body.car .line.active { text-shadow: 0 0 34px var(--glow); }
      body.car #msg { font-size: 30px; }
      #src {
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 1px;
        min-width: 120px;
        text-align: right;
      }
      #scroll {
        flex: 1 1 auto;
        position: relative;
        overflow: hidden;
        mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
      }
      #lines {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        text-align: center;
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        padding: 0 6%;
      }
      .line {
        font-size: 30px;
        font-weight: 600;
        line-height: 1.5;
        color: var(--dim);
        transition: color 0.25s, transform 0.25s, text-shadow 0.25s;
      }
      .line.upcoming { color: var(--upcoming); }
      .line.active {
        color: var(--active);
        transform: scale(1.08);
        text-shadow: 0 0 22px var(--glow);
      }
      #msg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 12%;
        font-size: 20px;
        color: var(--upcoming);
      }
      footer {
        flex: 0 0 auto;
        height: 4px;
        background: #1a1a30;
      }
      #prog {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--glow), #7a5cff);
        transition: width 0.25s linear;
      }
    </style>
    <script type="module" src="/src/karaoke.ts" defer></script>
  </head>
  <body>
    <div id="stage">
      <header>
        <span id="track">—</span>
        <span id="artist"></span>
        <button id="identify" title="Identify what's playing (ACRCloud)">🎧 Identify</button>
        <button id="carmode" title="Car mode — fullscreen, big text, screen stays awake">🚗 Car</button>
        <span id="src"></span>
      </header>
      <div id="scroll">
        <div id="lines"></div>
        <div id="msg">Play a song anywhere and the lyrics will appear here. 🎤</div>
      </div>
      <footer><div id="prog"></div></footer>
    </div>
  </body>
</html>
