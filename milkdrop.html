<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WinzAMP — Milkdrop</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #preset {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #fff;
        font: 13px Tahoma, sans-serif;
        text-shadow: 0 0 4px #000;
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #preset.show {
        opacity: 0.85;
      }
    </style>
    <script type="module" src="/src/milkdrop.ts" defer></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="preset"></div>
  </body>
</html>
