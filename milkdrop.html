<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>WinzAMP — Milkdrop</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #preset {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #fff;
        font: 13px Tahoma, sans-serif;
        text-shadow: 0 0 4px #000;
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #preset.show {
        opacity: 0.85;
      }
      #back {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 2;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 22px;
        line-height: 44px;
        text-align: center;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
      }
      #back:active {
        background: rgba(0, 0, 0, 0.75);
      }
    </style>
    <script type="module" src="/src/milkdrop.ts" defer></script>
  </head>
  <body>
    <button id="back" title="Back">‹</button>
    <canvas id="canvas"></canvas>
    <div id="preset"></div>
  </body>
</html>
